<section class="pricing-wrapper">
  <!-- TABLE -->
  <div class="pricing-table">
    <!-- LEFT INFO COLUMN -->
    <div class="col info">
      <div class="plan-header info-header">
        <div class="logo vertical">
          <img src="logos/Logo_NSPro.gg_Oficial_SF.png" alt="NextStagePro" class="logo-img" />
          <span>NextStagePro</span>
        </div>
      </div>

      <div class="row">Player profile creation</div>
      <div class="row">Team visibility</div>
      <div class="row">Scout access</div>
      <div class="row">Featured placement</div>
      <div class="row">Direct contact</div>
      <div class="row">Priority support</div>
    </div>

    <!-- PLAN BÁSICO -->
    <div class="col">
      <div class="plan-header">
        <div class="icon-box">
        </div>
        <h4>Básico</h4>
        <p class="price">GRATIS</p>
      </div>

      <div class="row"><fa-icon [icon]="faCircleCheck"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleXmark"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleXmark"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleXmark"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleXmark"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleXmark"></fa-icon></div>
    </div>

    <!-- PLAN JUGADOR -->
    <div class="col">
      <div class="plan-header">
        <div class="icon-box">
          <fa-icon [icon]="faUser"></fa-icon>
        </div>
        <h4>Jugador</h4>
        <p class="price">$5<span>/month</span></p>
      </div>

      <div class="row"><i class="fa-solid fa-check"></i></div>
      <div class="row"><i class="fa-solid fa-check"></i></div>
      <div class="row"><i class="fa-solid fa-check"></i></div>
      <div class="row"><i class="fa-solid fa-check"></i></div>
      <div class="row"><i class="fa-solid fa-check"></i></div>
      <div class="row"></div>
    </div>

    <!-- Plan Jugador PRO -->
    <div class="col popular">
      <div class="ribbon">POPULAR</div>

      <div class="plan-header">
       <div class="icon-box">
          <fa-icon [icon]="faUserPlus"></fa-icon>
        </div>
        <h4>Jugador PRO</h4>
        <p class="price">10€<span>/mes</span></p>
      </div>

      <div class="row"><i class="fa-solid fa-check"></i></div>
      <div class="row"><i class="fa-solid fa-check"></i></div>
      <div class="row"><i class="fa-solid fa-check"></i></div>
      <div class="row"><i class="fa-solid fa-check"></i></div>
      <div class="row"><i class="fa-solid fa-check"></i></div>
      <div class="row"><i class="fa-solid fa-check"></i></div>
    </div>

    <!-- Plan Equipo -->
    <div class="col">
      <div class="plan-header">
        <div class="icon-box">
          <fa-icon [icon]="faUsers"></fa-icon>
        </div>
        <h4>Equipo</h4>
        <p class="price">25€<span>/mes</span></p>
      </div>

      <div class="row"><i class="fa-solid fa-check"></i></div>
      <div class="row"><i class="fa-solid fa-check"></i></div>
      <div class="row"><i class="fa-solid fa-check"></i></div>
      <div class="row"><i class="fa-solid fa-check"></i></div>
      <div class="row"><i class="fa-solid fa-check"></i></div>
      <div class="row"><i class="fa-solid fa-check"></i></div>
    </div>
  </div>
  

  <!-- BUTTONS OUTSIDE TABLE -->
  <div class="pricing-buttons">
    <div></div>

    <a href="#" class="btn">Choose plan</a>
    <a href="#" class="btn">Choose plan</a>
    <a href="#" class="btn white popular-btn">Choose plan</a>
    <a href="#" class="btn">Choose plan</a>
