<header *ngIf="!isLogged" class="header-container">
  <div class="logo">
    <img src="logos/Logo_NSPro.gg_Oficial_SF.png" class="logo-img" />
    NextStage<span>Pro</span>
  </div>

  <nav class="menu">
    <a><fa-icon [icon]="faHome"></fa-icon> Inicio</a>
    <a><fa-icon [icon]="faCircleInfo"></fa-icon> Sobre mí</a>
    <a><fa-icon [icon]="faUser"></fa-icon> Perfil</a>
    <a><fa-icon [icon]="faSearch"></fa-icon> Búsqueda Jugadores</a>
    <a><fa-icon [icon]="faSackDollar"></fa-icon> Suscripciones</a>
    <a><fa-icon [icon]="faEnvelope"></fa-icon> Contacto</a>
  </nav>

  <div class="right">
    <button class="discord-btn" (click)="loginWithDiscord()">
      <img src="icons/discord.svg" class="icon" /> Login with Discord
    </button>
  </div>
</header>
<header *ngIf="isLogged" class="header-container">

  </div>

  <nav class="menu">

    <div class="notif">

</header>
