<section class="pricing-wrapper">

  <!-- TABLE -->
  <div class="pricing-table">

    <!-- LEFT INFO COLUMN -->
    <div class="col info">
      <div class="plan-header">
        <div class="logo vertical">
          <img
            src="logos/Logo_NSPro.gg_Oficial_SF.png"
            alt="NextStagePro"
            class="logo-img"
          />
          <span class="brand-name">
            NextStage<span class="brand-name-suffix">Pro</span>
          </span>
        </div>
      </div>

      <div class="row">Player profile creation</div>
      <div class="row">Team profile creation</div>
      <div class="row">Team visibility</div>
      <div class="row">Scout access</div>
      <div class="row">Featured placement</div>
      <div class="row">Direct contact</div>
      <div class="row">Priority support</div>
    </div>

    <!-- PLAN BÁSICO -->
    <div class="col">
      <div class="plan-header">
        <div class="icon-box-none"></div>
        <h4>Basic</h4>
        <p class="price">FREE</p>
      </div>

      <div class="row"><fa-icon [icon]="faCircleCheck"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleXmark"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleXmark"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleXmark"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleXmark"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleXmark"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleXmark"></fa-icon></div>
    </div>

    <!-- PLAN JUGADOR -->
    <div class="col">
      <div class="plan-header">
        <div class="icon-box">
          <fa-icon [icon]="faUser"></fa-icon>
        </div>
        <h4>Player</h4>
        <p class="price">$5<span>/month</span></p>
      </div>

      <div class="row"><fa-icon [icon]="faCircleCheck"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleXmark"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleCheck"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleXmark"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleXmark"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleXmark"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleXmark"></fa-icon></div>
    </div>

    <!-- PLAN JUGADOR PRO -->
    <div class="col popular">
      <div class="ribbon">POPULAR</div>

      <div class="plan-header">
        <div class="icon-box">
          <fa-icon [icon]="faUserPlus"></fa-icon>
        </div>
        <h4>Player PRO</h4>
        <p class="price">10€<span>/month</span></p>
      </div>

      <div class="row"><fa-icon [icon]="faCircleCheck"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleXmark"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleCheck"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleXmark"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleCheck"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleXmark"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleCheck"></fa-icon></div>
    </div>

    <!-- PLAN EQUIPO -->
    <div class="col">
      <div class="plan-header">
        <div class="icon-box">
          <fa-icon [icon]="faUsers"></fa-icon>
        </div>
        <h4>Team Pro</h4>
        <p class="price">25€<span>/month</span></p>
      </div>

      <div class="row"><fa-icon [icon]="faCircleXmark"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleCheck"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleCheck"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleCheck"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleXmark"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleCheck"></fa-icon></div>
      <div class="row"><fa-icon [icon]="faCircleCheck"></fa-icon></div>
    </div>

  </div>

  <!-- BUTTONS -->
  <div class="pricing-buttons">
    <div></div>
    <div></div>
    <a href="#" class="btn">Choose plan</a>
    <a href="#" class="btn popular-btn">Choose plan</a>
    <a href="#" class="btn">Choose plan</a>
  </div>

</section>
